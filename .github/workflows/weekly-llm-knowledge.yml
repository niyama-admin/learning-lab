name: Weekly LLM knowledge update

on:
  schedule:
    # 09:00 Asia/Kolkata every Saturday (GitHub cron is UTC).
    - cron: "30 3 * * 6"
  workflow_dispatch:
    inputs:
      week_ending:
        description: "Optional UTC date (YYYY-MM-DD); defaults to today"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-llm-knowledge
  cancel-in-progress: false

jobs:
  curate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 240
    env:
      MODEL_ACCESS_KEY: ${{ secrets.MODEL_ACCESS_KEY }}
      DIGITALOCEAN_MODEL_ID: ${{ vars.DIGITALOCEAN_MODEL_ID }}
      REQUIRE_THOROUGH_TUTORIALS: "true"
      # Accepted chapter parts are cached so a re-run resumes instead of paying for hours of authoring again.
      TUTORIAL_CACHE_DIR: ${{ runner.temp }}/tutorial-parts
      WEEKLY_PR_BODY_PATH: ${{ runner.temp }}/weekly-pr-body.md
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install PDF text extraction
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Offline self-tests (model client retries, per-paper failure isolation)
        working-directory: llm-learning-repository
        run: |
          node weekly-update.mjs --self-test
          node test-weekly-resilience.mjs

      - name: Default pull request body
        run: printf 'Automated Saturday intake from arXiv. Requires human review; this workflow never auto-merges.\n' > "$WEEKLY_PR_BODY_PATH"

      - name: Restore cached chapter parts
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/tutorial-parts
          key: tutorial-parts-${{ github.run_id }}
          restore-keys: |
            tutorial-parts-

      - name: Fetch, select, summarize, and download
        id: curate
        working-directory: llm-learning-repository
        run: node weekly-update.mjs ${{ inputs.week_ending && format('--week-ending={0}', inputs.week_ending) || '' }}

      - name: Save cached chapter parts
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/tutorial-parts
          key: tutorial-parts-${{ github.run_id }}

      - name: Validate core and weekly repositories
        working-directory: llm-learning-repository
        run: |
          node verify-repository.mjs
          node weekly-update.mjs --verify

      - name: Open or refresh the weekly review PR
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          add-paths: llm-learning-repository/weekly
          branch: automation/weekly-llm-knowledge
          delete-branch: true
          commit-message: weekly-llm-knowledge-update
          title: "Weekly LLM knowledge update"
          body-path: ${{ runner.temp }}/weekly-pr-body.md
          labels: documentation, automated
